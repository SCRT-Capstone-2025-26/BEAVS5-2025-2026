name: Run Tests via Pytest

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linting Tools
        run: |
          pip install ruff
          # TODO: Lint with C++
          # sudo apt-get update
          # sudo apt-get install -y clang-tidy

      - name: Run Ruff
        run: ruff check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    if: ${{ matrix.os == 'ubuntu-latest' || github.event_name == 'pull_request' }} # Maybe || github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Build
        run: |
          pip install -e ".[test]"

      - name: Test with pytest
        run: |
          pytest -v -s
